[project]
name = "nautilus-trading"
version = "0.1.0"
description = "Algorithmic trading platform built on NautilusTrader"
authors = [{name = "Nautilus Trading Team"}]
requires-python = ">=3.12"
dependencies = [
    "nautilus_trader>=1.224.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "scikit-learn>=1.8.0",
    "lightgbm>=4.6.0",
    "requests>=2.33.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "vulture>=2.10",
    "isort>=5.0",
    "ipython>=8.17.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
viz = [
    "plotly>=5.18.0",
    "jupyterlab>=4.0.0",
]
binance = [
    "nautilus_trader>=1.224.0",
]
interactive_brokers = [
    "nautilus_trader>=1.224.0",
]
ml = [
    "timesfm>=1.3.0",
    "torch>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
]
kronos = [
    # Kronos is NOT a PyPI package — clone the repo and set KRONOS_REPO_PATH:
    #   git clone https://github.com/shiyu-coder/Kronos.git ~/kronos
    #   export KRONOS_REPO_PATH=~/kronos
    # Use: make install-kronos  (runs uv sync + clones repo)
    # Deps taken directly from Kronos requirements.txt:
    "torch>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "einops>=0.8.1",
    "huggingface_hub>=0.33.0",
    "safetensors>=0.6.0",
    "tqdm>=4.67.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
nt = "nautilus_trading.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short", "--basetemp=./.pytest-tmp"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "binance_testnet: opt-in smoke against live Binance Spot Testnet (requires BINANCE_TESTNET_API_KEY, BINANCE_TESTNET_API_SECRET, and BINANCE_TESTNET_ED25519_KEY_PATH)",
]

[tool.coverage.run]
source = ["nautilus_trading"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebooks are exploratory research artifacts; their formatting and lint
# concerns are handled separately (nbstripout, nbqa, or manual curation).
# Ruff's --fix canonicalizes the source field and produces large, review-
# unfriendly diffs, so we skip them entirely here.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Runner scripts bootstrap sys.path before package imports -- E402 is structural.
"../strategies/crypto/kronos/backtest.py" = ["E402"]
# Test files bootstrap sys.path before package imports (justified E402).
"../tests/**" = ["E402"]

[tool.vulture]
# Names used by NautilusTrader framework callbacks that appear unused to static analysis.
# `duration` is a placeholder CLI arg on `nt paper-trade` (time-boxed runs land in a later PR).
ignore_names = ["bar", "duration"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "nautilus_trader.*"
ignore_missing_imports = true

