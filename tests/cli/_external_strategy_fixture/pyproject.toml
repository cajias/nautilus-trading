[project]
name = "external-strat-fixture"
version = "0.0.1"
description = "Synthetic external strategy fixture used by the entry-point smoke test only."
requires-python = ">=3.12"

[project.entry-points."nautilus_trading.strategies"]
external_strat = "external_strat:STRATEGY_SPEC"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["external_strat*"]
